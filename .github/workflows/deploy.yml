# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Deploy VitePress site to Pages

on: 
  push:
    tags:
      - '*'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Tag Matrix Definition
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.create-matrix.outputs.tags }}
    steps:
      - name: Checkout For Matrix
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build Matrix
        id: create-matrix
        run: |
          raw=`git for-each-ref --format='%(refname:short)' refs/tags`;
          tags=`printf '%s\n' "${raw[@]}" | jq -R . | jq -s -c .`;
          echo "tags=${tags}" >> $GITHUB_OUTPUT

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy: 
      matrix:
        tags: ${{ fromJSON(needs.define-matrix.outputs.tags) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.tags }}
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build with VitePress
        env:
          BASE: /allium-docs/${{ matrix.tags }}/
          VERSION: ${{ matrix.tags }}
        run: pnpm run build
      - name: Upload ${{ matrix.tags }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tags }}
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs:
      - build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4